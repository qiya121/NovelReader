name: iOS Build

# 用途：在没有 Mac 的机器上验证「这个工程到底能不能编译」。
# GitHub 的 macOS runner 预装 Xcode + iOS SDK + 模拟器，等同于一台云端 Mac。
# 触发：push 到任意分支，或在 Actions 页面手动 Run workflow。

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macos-15 自带 Xcode 16，满足本工程 objectVersion = 77 的最低要求。
    # 想用更新的 Xcode 可换 macos-26，具体以 runner 镜像文档为准。
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: 环境自检
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun simctl list runtimes | grep -i ios || true

      - name: 解析 SPM 依赖（GRDB）
        run: |
          xcodebuild -project NovelReader.xcodeproj \
            -scheme NovelReader \
            -resolvePackageDependencies

      - name: 编译 App
        # 全量日志写入 build.log，同时只把 error: 行回显到页面上，方便直接读。
        run: |
          set -o pipefail
          xcodebuild -project NovelReader.xcodeproj \
            -scheme NovelReader \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          status=$?
          grep -n "error:" build.log | head -80 || true
          tail -5 build.log || true
          exit $status

      - name: 跑单元测试
        id: test
        # 单测要落在具体模拟器上，先列出本机有的设备名再挑一个。
        # 若设备名对不上（Xcode 版本不同），把下面 NAME 改成上一步列出的任意 iPhone。
        # 日志同样落文件：只 tail 最后几行的话，失败用例会滚出视野。
        run: |
          set -o pipefail
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | head -1)
          echo "使用模拟器: $NAME"
          xcodebuild -project NovelReader.xcodeproj \
            -scheme NovelReader \
            -destination "platform=iOS Simulator,name=$NAME" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test > test.log 2>&1
          status=$?
          grep -E "Executed [0-9]+ test" test.log | tail -3 || true
          grep -nE "error: -\[|XCTAssert.* failed|with [1-9][0-9]* failure" test.log | head -40 || true
          tail -5 test.log || true
          exit $status
        continue-on-error: true

      - name: 单测失败时让任务变红
        # continue-on-error 会把测试失败伪装成绿灯，这里补回真实结论：
        # PRD §9 要求「单元测试通过才允许合并」。
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::单元测试未通过，见 test.log 产物与上方回显"
          exit 1

      - name: 收集日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            test.log
            build/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore

      - name: 失败时打印错误摘要
        if: failure()
        run: |
          echo "=== 失败。请在上方步骤的日志里搜 'error:' ==="
          grep -n "error:" build.log 2>/dev/null | head -50 || true
          grep -n "error:" test.log 2>/dev/null | head -50 || true
